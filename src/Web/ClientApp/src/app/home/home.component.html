<div class="home-container">
  <div class="content">
    <div class="content-head">
      <div>
        <h1>{{ title }}</h1>
        <p>{{ description }}</p>
      </div>
      <p-button
        label="הוספת נתון חדש"
        icon="pi pi-plus"
        (onClick)="openNewDataDialog()" />
    </div>

    <app-menue></app-menue>
  </div>
</div>

<!-- הדיאלוג מוטמע במסך שממנו הוא נפתח — הרקע שמאחוריו נשאר גלוי ומטושטש -->
<app-adding-new-data-entry
    [(visible)]="newDataVisible"
    (saved)="onNewDataSaved()" />
