
<div class="controlsPanel" dir="rtl">
  <!-- תקופת נתונים -->
  <div class="filter filter--period">
    <label class="filter__label" for="filterPeriod">תקופת נתונים</label>
    <p-select
      inputId="filterPeriod"
      [options]="periodOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="period"
      (onChange)="onFilterChange()"
      fluid>
    </p-select>
  </div>

  <!-- כרטיסים בשורה -->
  <div class="filter filter--cards">
    <label class="filter__label" for="filterCardsPerRow">כרטיסים בשורה</label>
    <p-select
      inputId="filterCardsPerRow"
      [options]="cardsPerRowOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="cardsPerRow"
      (onChange)="onFilterChange()"
      fluid>
    </p-select>
  </div>

  <!-- חיפוש נתון — תופס את שאר הרוחב (flex:1 בדמו) -->
  <div class="filter filter--search">
    <label class="filter__label" for="filterSearchText">חיפוש נתון</label>
    <input
      id="filterSearchText"
      pInputText
      fluid
      type="text"
      [(ngModel)]="searchText"
      (ngModelChange)="onFilterChange()"
      placeholder="חיפוש לפי שם נתון" />
  </div>

  <!-- רענון — כפתור בגובה השדות, ללא תווית מעליו -->
  <div class="filter filter--action">
    <p-button
      styleClass="refreshButton"
      severity="secondary"
      [outlined]="true"
      (onClick)="refresh()"
      ariaLabel="רענון">
      <span class="refreshButton__icon" aria-hidden="true">↻</span>
      <span class="refreshButton__label">רענון</span>
    </p-button>
  </div>
</div>
