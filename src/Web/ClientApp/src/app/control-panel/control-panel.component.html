
<div class="headline" dir="rtl">
  <div class="headline__text">
    <br/>
    <div class="eyebrow">מבט רוחבי על פעילות הגבייה</div>
    <h1>מערכת הניהול והבקרה</h1>
    <p>כל הנתונים והתוצאות במסך זה להמחשה בלבד. ניתן להגדיר נתונים ולהוסיף כרטיסים באופן דינמי.</p>
  </div>
  <div class="headline__actions">
    <p-button
      styleClass="headlineBtn"
      severity="secondary"
      [outlined]="true"
      routerLink="/display-management">
      <span class="headlineBtn__icon" aria-hidden="true">⚙</span>
      <span>התאמת תצוגה</span>
    </p-button>
    <p-button styleClass="headlineBtnPrimary" (onClick)="openNewData()">
      <span class="headlineBtn__icon" aria-hidden="true">+</span>
      <span>נתון חדש</span>
    </p-button>
  </div>
</div>
@if (detailKey() !== null) {
  <app-detailed-dialogue [metricKey]="detailKey()!" (closed)="closeDetail()" />
}

<!-- דיאלוג יצירת נתון חדש — מצב יצירה (metric = null) -->
<app-adding-new-data-entry
  [(visible)]="newDataVisible"
  (saved)="onNewDataSaved()" />


<app-control-panel-filters
  (filtersChanged)="onFiltersChanged($event)"
  (cardsPerRowChanged)="onCardsPerRowChanged($event)">
</app-control-panel-filters>

<app-control-panel-cube
  [columns]="cardsPerRow() ?? 4"
  [period]="period()"
  [searchMetricName]="searchMetricName()"
  [refreshToken]="refreshToken()"
  (detail)="openDetail($event)">
</app-control-panel-cube>
