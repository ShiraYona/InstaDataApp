
<div class="headline" dir="rtl">
  <div class="headline__text">
    <div class="eyebrow">מבט רוחבי על פעילות הגבייה</div>
    <h1>מערכת הניהול והבקרה</h1>
    <p>כל הנתונים והתוצאות במסך זה להמחשה בלבד. ניתן להגדיר נתונים ולהוסיף כרטיסים באופן דינמי.</p>
  </div>
  <div class="headline__actions">
    <p-button styleClass="headlineBtn" severity="secondary" [outlined]="true">
      <span class="headlineBtn__icon" aria-hidden="true">⚙</span>
      <span>התאמת תצוגה</span>
    </p-button>
    <p-button styleClass="headlineBtnPrimary">
      <span class="headlineBtn__icon" aria-hidden="true">+</span>
      <span>נתון חדש</span>
    </p-button>
  </div>
</div>
@if (detailKey() !== null) {
  <app-detailed-dialogue [metricKey]="detailKey()!" (closed)="closeDetail()" />
}


<app-control-panel-filters></app-control-panel-filters>



<app-control-panel-cube (detail)="openDetail($event)"
></app-control-panel-cube>
